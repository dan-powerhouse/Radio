name: RADIO CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  kernel:
    name: Kernel and vectors
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.5'
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.5'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:mutations
      - run: npm run example
      - run: bash scripts/package-deploy.sh
      - run: bash scripts/test-delivery.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: radio-supabase-${{ github.sha }}
          path: |
            release/radio-supabase.tar.gz
            release/radio-supabase.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
  postgres:
    name: PostgreSQL migrations and transactions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: radio_ci
          POSTGRES_DB: radio_ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d radio_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.5'
          cache: npm
      - run: npm ci
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Test migration and transaction contract
        env:
          LOGLINE_DISPOSABLE_DB: 'yes'
          LOGLINE_TEST_DATABASE_URL: postgresql://postgres:radio_ci@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/radio_ci
        run: bash scripts/test-postgres-ci.sh
