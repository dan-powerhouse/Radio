name: RADIO Staging
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Preview migrations or apply an explicitly approved staging release
        options:
          - plan
          - apply
        default: plan
        required: true
      confirm_project:
        type: string
        description: Exact approved staging Supabase project ref
        required: true
      confirm_commit:
        type: string
        description: Full SHA of the intended main commit
        required: true

permissions:
  contents: read

concurrency:
  group: radio-staging
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require exact main revision
        env:
          CONFIRM_COMMIT: ${{ inputs.confirm_commit }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRM_COMMIT" = "$GITHUB_SHA"
  verify:
    needs: preflight
    uses: ./.github/workflows/ci.yml
  staging:
    name: Staging release
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.5'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: radio-supabase-${{ github.sha }}
          path: release
      - name: Verify artifact and execute approved staging mode
        env:
          RADIO_DEPLOY_MODE: ${{ inputs.mode }}
          RADIO_CONFIRM_PROJECT: ${{ inputs.confirm_project }}
          RADIO_CONFIRM_COMMIT: ${{ inputs.confirm_commit }}
          RADIO_STAGING_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          RADIO_STAGING_DEPLOY_APPROVED: ${{ vars.RADIO_STAGING_DEPLOY_APPROVED }}
          RADIO_STAGING_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: bash scripts/deploy-staging.sh "$RADIO_DEPLOY_MODE" release
